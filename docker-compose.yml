services:
  api:
    build: .
    container_name: churn_api
    ports:
      - "8000:8000"
    environment:
      DB_USER: postgres
      DB_PASSWORD: your_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: churn_ltv_db
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    container_name: churn_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: churn_ltv_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  metabase:
    image: metabase/metabase
    container_name: churn_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  airflow:
    image: apache/airflow:2.9.0
    container_name: airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    command: standalone

  prometheus:
    image: prom/prometheus:latest
    container_name: churn_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    depends_on:
      - api
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: churn_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: churn_cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  grafana_data:
